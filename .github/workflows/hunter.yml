name: Keep alive and hunt tenders
on:
  schedule:
    - cron: '*/14 * * * *'
    - cron: '10 */6 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Wake server
        run: curl -fsS --max-time 90 --retry 2 "${{ secrets.APP_URL }}/" > /dev/null
      - name: Run tender hunter
        if: github.event.schedule == '10 */6 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -fsS --max-time 90 -X POST -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" "${{ secrets.APP_URL }}/admin/run-hunter"
