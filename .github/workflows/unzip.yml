name: Unzip project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "no zip"; exit 0; fi
          unzip -o "$ZIP"
          cp -r tenderbot-ai/. .
          rm -rf tenderbot-ai "$ZIP"
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Update project" || echo "nothing to commit"
          git push
